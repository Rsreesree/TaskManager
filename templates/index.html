<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Task Manager</title>
<link rel="stylesheet" href="static/style.css">
<script src="static/script.js"></script>

</head>
<body>
<div class="container">
    <div class="header">
        <h1>📋 Daily Task Manager</h1>
        <div class="date" id="currentDate"></div>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="stat-number" id="totalTasks">0</div><div class="stat-label">Total Tasks</div></div>
        <div class="stat-card"><div class="stat-number" style="color: #ef4444;" id="highPriority">0</div><div class="stat-label">High Priority</div></div>
        <div class="stat-card"><div class="stat-number" style="color: #10b981;" id="completedTasks">0</div><div class="stat-label">Completed</div></div>
        <div class="stat-card"><div class="stat-number" style="color: #fcd34d;" id="overdueTasks">0</div><div class="stat-label">Overdue</div></div>
    </div>

    <div class="task-input-section">
        <div class="input-row">
            <input type="text" id="taskInput" placeholder="Task description..." class="input-full" />
        </div>
        <div class="input-row">
            <select id="categorySelect">
                <option value="personal">Personal</option>
                <option value="work">Work</option>
                <option value="health">Health</option>
                <option value="other">Other</option>
            </select>
            <select id="prioritySelect">
                <option value="low">Low Priority</option>
                <option value="medium" selected>Medium Priority</option>
                <option value="high">High</option>
            </select>
            <input type="text" id="personInput" placeholder="Assigned to..." list="personList" />
            <datalist id="personList"></datalist>
            <input type="text" id="contactInput" placeholder="Contact (phone/email)" />
            <input type="date" id="dueDateInput" />
            <button onclick="addTask()">Add Task</button>
        </div>
    </div>

    <div class="filters-section">
        <div class="filter-group">
            <div class="filter-item">
                <label>Filter by Date:</label>
                <input type="date" id="dateFilter" onchange="applyFilters()" />
            </div>
            <div class="filter-item">
                <label>Filter by Person:</label>
                <select id="personFilter" onchange="applyFilters()">
                    <option value="all">All People</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Filter by Priority:</label>
                <select id="priorityFilter" onchange="applyFilters()">
                    <option value="all">All Priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>
        </div>
        <div class="status-filters">
            <button class="filter-btn active" onclick="filterByStatus('all')">All Tasks</button>
            <button class="filter-btn" onclick="filterByStatus('active')">Active</button>
            <button class="filter-btn" onclick="filterByStatus('completed')">Completed</button>
            <button class="filter-btn" onclick="clearFilters()">Clear Filters</button>
        </div>
    </div>

    <div class="tasks-container" id="tasksContainer">
        <div class="empty-state">No tasks yet. Add one to get started!</div>
    </div>
</div>

</body>
</html>
